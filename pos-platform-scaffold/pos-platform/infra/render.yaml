# api + ai services as code. Both are free-tier web services: they spin down
# after 15 minutes idle and take about a minute to wake. The offline-first
# client means a cold API never blocks a sale; a cron ping (below) keeps
# both warm during trading hours anyway.
services:
  - type: web
    name: pos-api
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @pos/api prisma:generate && pnpm --filter @pos/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false

  - type: web
    name: pos-ai
    env: python
    plan: free
    buildCommand: pip install -r apps/ai/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir apps/ai
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL_READONLY
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: cron
    name: pos-api-warm-ping
    env: node
    plan: free
    schedule: "*/10 6-22 * * *" # every 10 min, 06:00-22:00 — trading hours
    buildCommand: "true"
    startCommand: "curl -sf https://pos-api.onrender.com/health && curl -sf https://pos-ai.onrender.com/health"

  - type: cron
    name: pos-mpesa-reconcile-sweep
    env: node
    plan: free
    schedule: "* * * * *" # every minute — mitigation #1, never trust the callback alone
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm --filter @pos/api exec tsx src/jobs/mpesa-reconcile.ts
